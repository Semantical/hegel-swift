name: Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create after the tests pass
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: swift --version
      - run: swift test -q

  cross-platform:
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@497d9ab8410e69981b3b2f28da24cf7bf4b8733d
    with:
      enable_linux_checks: true
      enable_windows_checks: true
      linux_swift_versions: '["6.3"]'
      windows_swift_versions: '["6.3"]'

  tag:
    if: github.event_name == 'workflow_dispatch'
    needs: [macos, cross-platform]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release tags must be created from main"
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="refs/tags/$TAG" \
            --raw-field sha="$GITHUB_SHA"
