name: Test

on:
  pull_request:
  push:
    branches: [main, cross-platform]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: swift --version
      - run: swift test -q

  cross-platform:
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@497d9ab8410e69981b3b2f28da24cf7bf4b8733d
    with:
      enable_linux_checks: true
      enable_windows_checks: true
      linux_swift_versions: '["6.3"]'
      windows_swift_versions: '["6.3"]'
